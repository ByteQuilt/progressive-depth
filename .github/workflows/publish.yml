name: Release

# On every push to main, release-please keeps a release pull request up to date with the next version and its
# CHANGELOG entry, both generated from conventional commits. Merging that pull request tags the version and creates
# the GitHub release, and the publish job ships the same build to npmjs and GitHub Packages. A release created with
# the workflow token cannot trigger another workflow, so publishing lives in this one.
on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version pinned in package.json#packageManager.
      - uses: pnpm/action-setup@v4

      # Node 24 ships npm 11.5.1 or later, which trusted publishing requires.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run check:package

      # GitHub Packages needs a token. npmjs needs none: trusted publishing authenticates through OIDC.
      - name: Authenticate to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      # A re-run skips any registry that already has this version.
      - name: Publish
        run: |
          spec="$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')"
          publish() {
            if npm view "$spec" version --registry="$1" --@bytequilt:registry="$1" > /dev/null 2>&1; then
              echo "$spec is already on $1"
            else
              npm publish --access public --registry="$1" --@bytequilt:registry="$1"
            fi
          }
          publish https://registry.npmjs.org/
          publish https://npm.pkg.github.com/

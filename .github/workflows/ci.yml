name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Formatting, lint, and import order. Needs no install: setup-biome reads the version from the lockfile.
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: biomejs/setup-biome@v2
      - run: biome ci .

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version pinned in package.json#packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # publint and attw check what consumers resolve: exports, types per module system, and package files.
      - run: pnpm run check:package
